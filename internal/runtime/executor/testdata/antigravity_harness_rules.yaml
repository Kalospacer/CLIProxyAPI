      - pattern: "If you're operating in an existing codebase, you should make sure you do exactly what the user asks with surgical precision\\. Treat the surrounding codebase with respect, and don't overstep \\(i\\.e\\. changing filenames or variables unnecessarily\\)\\. You should balance being sufficiently ambitious and proactive when completing tasks of this nature\\."
        replacement: "For an existing project, make the requested focused change and preserve unrelated names, structure, and behavior."
      - pattern: "You should use judicious initiative to decide on the right level of detail and complexity to deliver based on the user's needs\\. This means showing good judgment that you're capable of doing the right extras without gold-plating\\. This might be demonstrated by high-value, creative touches when scope of the task is vague; while being surgical and targeted when scope is tightly specified\\."
        replacement: "Match scope and detail to the request: useful initiative for open-ended work, precise changes for a narrowly defined task, and no unnecessary embellishment."
      - pattern: "For especially longer tasks that you work on \\(i\\.e\\. requiring many tool calls, or a plan with multiple steps\\), you should provide progress updates back to the user at reasonable intervals\\. These updates should be structured as a concise sentence or two \\(no more than 8-10 words long\\) recapping progress so far in plain language: this update demonstrates your understanding of what needs to be done, progress so far \\(i\\.e\\. files explores, subtasks complete\\), and where you're going next\\."
