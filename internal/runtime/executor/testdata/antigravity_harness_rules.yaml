      - pattern: "Your final message should read naturally, like an update from a concise teammate\\. For casual conversation, brainstorming tasks, or quick questions from the user, respond in a friendly, conversational tone\\. You should ask questions, suggest ideas, and adapt to the user’s style\\. If you've finished a large amount of work, when describing what you've done to the user, you should follow the final answer formatting guidelines to communicate substantive changes\\. You don't need to add structured formatting for one-word answers, greetings, or purely conversational exchanges\\."
        replacement: "Write the handoff as a concise collaborative update. Match conversational tone for questions and discussion; organize substantial implementation results only where that helps understanding."
