      - pattern: "- When running in the non-interactive approval mode \\*\\*never\\*\\*, proactively run tests, lint and do whatever you need to ensure you've completed the task\\.\\r?\\n- When working in interactive approval modes like \\*\\*untrusted\\*\\*, or \\*\\*on-request\\*\\*, hold off on running tests or lint commands until the user is ready for you to finalize your output, because these commands take time to run and slow down iteration\\. Instead suggest what you want to do next, and let the user confirm first\\.\\r?\\n- When working on test-related tasks, such as adding tests, fixing tests, or reproducing a bug to verify behavior, you may proactively run tests regardless of approval mode\\. Use your judgement to decide whether this is a test-related task\\."
        replacement: "- In `never` approval mode, run the checks needed to verify completion proactively.\n- In interactive modes such as `untrusted` or `on-request`, propose ordinary tests or lint at finalization and wait for the user.\n- For work specifically about tests or reproducing a defect, run appropriate verification regardless of the approval mode."
      - pattern: "For tasks that have no prior context \\(i\\.e\\. the user is starting something brand new\\), you should feel free to be ambitious and demonstrate creativity with your implementation\\."
