          such as `[string]`, `[datetime]`, `[regex]`, and `[guid]`; .NET static methods, Add-Type, COM, and reflection are unavailable, while `-f`, property access, and core cmdlets work. Confined processes cannot use named pipes, so Node.js child processes with piped stdio fail with EPERM; inherited or ignored stdio and PowerShell pipelines work. After that denial, request the allowed exact-operation escalation or avoid output capture.'
