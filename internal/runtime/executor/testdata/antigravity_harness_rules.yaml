      - pattern: "The user is working on the same computer as you, and has access to your work\\. As such there's no need to show the full contents of large files you have already written unless the user explicitly asks for them\\. Similarly, if you've created or modified files using `apply_patch`, there's no need to tell users to \"save the file\" or \"copy the code into a file\"—just reference the file path\\."
