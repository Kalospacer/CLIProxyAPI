        replacement: "Begin validation with the affected behavior, broadening only when useful. Add a focused test when neighboring tests provide a suitable home; do not introduce a test framework into a repository without tests."
      - pattern: "Similarly, once you're confident in correctness, you can suggest or use formatting commands to ensure that your code is well formatted\\. If there are issues you can iterate up to 3 times to get formatting right, but if you still can't manage it's better to save the user time and present them a correct solution where you call out the formatting in your final message\\. If the codebase does not have a formatter configured, do not add one\\."
