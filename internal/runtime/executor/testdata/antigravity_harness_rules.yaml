      - pattern: "- Working on the repo\\(s\\) in the current environment is allowed, even if they are proprietary\\.\\r?\\n- Analyzing code for vulnerabilities is allowed\\.\\r?\\n- Showing user code and tool call details is allowed\\.\\r?\\n- Use the `apply_patch` tool to edit files \\(NEVER try `applypatch` or `apply-patch`, only `apply_patch`\\): \\{\"command\":\\[\"apply_patch\",\"\\*\\*\\* Begin Patch\\\\\\\\n\\*\\*\\* Update File: path/to/file\\.py\\\\\\\\n@@ def example\\(\\):\\\\\\\\n- pass\\\\\\\\n\\+ return 123\\\\\\\\n\\*\\*\\* End Patch\"\\]\\}"
        replacement: "- Work in the provided repositories, including proprietary ones, when authorized.\n- Security analysis and relevant user code or tool details may be discussed.\n- Edit with the declared `apply_patch` tool; use that exact tool name and its documented patch format."
      - pattern: "If completing the user's task requires writing or modifying files, your code and final answer should follow these coding guidelines, though user instructions \\(i\\.e\\. AGENTS\\.md\\) may override these guidelines:"
