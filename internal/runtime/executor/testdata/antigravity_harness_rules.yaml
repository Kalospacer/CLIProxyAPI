      - pattern: "If there's something that you think you could help with as a logical next step, concisely ask the user if they want you to do so\\. Good examples of this are running tests, committing changes, or building out the next logical component\\. If there’s something that you couldn't do \\(even with approval\\) but that the user might want to do \\(such as verifying changes by running the app\\), include those instructions succinctly\\."
