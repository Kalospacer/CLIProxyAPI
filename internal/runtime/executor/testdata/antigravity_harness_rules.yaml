        replacement: "- Put commands, paths, environment variables, identifiers, and literal examples in backticks.\n- Use code styling for literal keywords.\n- Do not combine bold and code styling on the same text."
      - pattern: "\\*\\*File References\\*\\*\\r?\\nWhen referencing files in your response, make sure to include the relevant start line and always follow the below rules:\\r?\\n  \\* Use inline code to make file paths clickable\\.\\r?\\n  \\* Each reference should have a stand alone path\\. Even if it's the same file\\.\\r?\\n  \\* Accepted: absolute, workspace‑relative, a/ or b/ diff prefixes, or bare filename/suffix\\.\\r?\\n  \\* Line/column \\(1‑based, optional\\): :line\\[:column\\] or #Lline\\[Ccolumn\\] \\(column defaults to 1\\)\\.\\r?\\n  \\* Do not use URIs like file://, vscode://, or https://\\.\\r?\\n  \\* Do not provide range of lines\\r?\\n  \\* Examples: src/app\\.ts, src/app\\.ts:42, b/server/index\\.js#L10, C:\\\\repo\\\\project\\\\main\\.rs:12:5"
        replacement: "**File links**\nInclude a standalone file path and a one-based starting line where relevant. Accept absolute, workspace-relative, diff-prefixed, or bare paths. Use `:line[:column]` or `#Lline[Ccolumn]`, with column 1 as the default. Use inline code for clickable paths. Avoid URI schemes and line ranges."
      - pattern: "- Place related bullets together; don’t mix unrelated concepts in the same section\\.\\r?\\n- Order sections from general → specific → supporting info\\.\\r?\\n- For subsections \\(e\\.g\\., “Binaries” under “Rust Workspace”\\), introduce with a bolded keyword bullet, then list items under it\\.\\r?\\n- Match structure to complexity:\\r?\\n  - Multi-part or detailed results → use clear headers and grouped bullets\\.\\r?\\n  - Simple results → minimal headers, possibly just a short list or paragraph\\."
        replacement: "- Group related points and move from the main result to supporting detail.\n- Use a bold keyword for a subsection when needed.\n- Use organized sections for complex results and a short paragraph or list for simple ones."
      - pattern: "- Keep the voice collaborative and natural, like a coding partner handing off work\\.\\r?\\n- Be concise and factual — no filler or conversational commentary and avoid unnecessary repetition\\r?\\n- Use present tense and active voice \\(e\\.g\\., “Runs tests” not “This will run tests”\\)\\.\\r?\\n- Keep descriptions self-contained; don’t refer to “above” or “below”\\.\\r?\\n- Use parallel structure in lists for consistency\\."
        replacement: "- Be factual, concise, natural, and collaborative.\n- Prefer present tense and active verbs.\n- Make each point self-contained without referring to an unspecified earlier section.\n- Keep list phrasing parallel."
      - pattern: "- Don’t use literal words “bold” or “monospace” in the content\\.\\r?\\n- Don’t nest bullets or create deep hierarchies\\.\\r?\\n- Don’t output ANSI escape codes directly — the CLI renderer applies them\\.\\r?\\n- Don’t cram unrelated keywords into a single bullet; split for clarity\\.\\r?\\n- Don’t let keyword lists run long — wrap or reformat for scanability\\."
