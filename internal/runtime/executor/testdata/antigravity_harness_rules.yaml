config-version: 8
oauth:
  providers:
    antigravity:
      sensitive-patterns-replace:
      - pattern: '(?m)^You are a coding agent powered by the [^\r\n]+ model\.\r?$'
        replacement: You are a coding agent.
      - pattern: "(?m)^### How to use skills\n\n- Discovery: When a `## Skills` section is present, it lists the skills available in the current session\\. Each entry includes a name, description, and location for its `SKILL\\.md`\\. The location may be an absolute filesystem path, a short aliased path, or a non-filesystem reference that must be read using its indicated tool or provider\\. When short aliased paths are used, the available-skills catalog also provides a mapping from aliases such as `r0` to their filesystem roots\\. Expand the alias before accessing the skill\\.\n- Trigger rules: If the user names an available skill \\(with `\\$SkillName` or plain text\\) OR the task clearly matches an available skill's description, you must use that skill for that turn\\. Multiple mentions mean use them all\\. Do not carry skills across turns unless re-mentioned\\.\n- Missing/blocked: If a named skill is not available or its `SKILL\\.md` cannot be read, say so briefly and continue with the\
          \ best fallback\\.\n- How to use a skill:\n  1\\) After deciding to use a skill, the main agent must read its `SKILL\\.md` completely before taking task actions\\. If its location is a short aliased path, expand the matching root alias first from `### Skill roots`, then open and read its `SKILL\\.md` completely before taking task actions\\. For a filesystem path, open the file\\. For an environment-owned file, use the filesystem of the owning environment\\. For an orchestrator reference, call `skills\\.list` with `\\{\"authority\":\\{\"kind\":\"orchestrator\"\\}\\}`, select the matching package, and pass its `main_resource` to `skills\\.read`\\. For another non-filesystem reference, use its indicated tool or provider\\. If a read is truncated or paginated, continue until EOF\\.\n  2\\) When `SKILL\\.md` references another file or resource, use the same access mechanism\\. Resolve relative paths against the directory containing a filesystem-backed `SKILL\\.md`\\. For orchestrator\
          \ skills, pass the exact referenced resource identifier with the same authority and package to `skills\\.read`; do not treat `skill://` identifiers as filesystem paths\\.\n  3\\) If `SKILL\\.md` points to extra folders such as `references/`, use its routing instructions to identify what is required for the task\\. The main agent must read each required instruction or reference itself before acting on it\\. Do not delegate reading, summarizing, or interpreting skill instructions to a subagent\\. Subagents may still perform task work when the selected skill allows it\\.\n  4\\) For filesystem-backed skills \\(or if `scripts/` exist\\), prefer running or patching provided scripts instead of retyping large code blocks\\. For orchestrator skills, use `skills\\.read` and the available tools; do not invent a local path\\.\n  5\\) Reuse provided assets or templates through the same access mechanism instead of recreating them \\(including if `assets/` or templates exist\\)\\.\n- Coordination\
          \ and sequencing:\n  - If multiple skills apply, choose the minimal set that covers the request and state the order you'll use them\\.\n  - Announce which skills you're using and why\\. If you skip an obvious skill, say why\\.\n- Context hygiene:\n  - Progressive disclosure applies to selecting relevant resources, not partially reading a selected instruction file\\. Do not load unrelated references, scripts, or assets\\.\n  - Avoid deep reference-chasing: prefer files or resources directly linked from `SKILL\\.md` unless blocked\\.\n  - When variants exist, select only the relevant references and note the choice\\.\n- Safety and fallback: If a skill cannot be applied cleanly, state the issue, choose the best alternative, and continue\\.\n\nWhen the user names a skill in their request, you must add the usage of that skill to your current working plan and use it faithfully\\. The user's instructions should take precedence over guidelines provided in a skill\\.\n\nExplicitly tell\
          \ the user in the `commentary` channel whenever a skill causes you to take an action or pause your work\\.\n\nWhen using a skill the user did not explicitly name, follow this procedure:\n\n- First, tell the user in the commentary channel \\*\\*why\\*\\* you are using the skill\\.\n- Then, use the skill as long as it stays within the scope of the task\\.\n- Next, if using the skill resulted in material changes \\(especially when this requires non-trivial judgment\\), mention how it influenced your work \\(but only in the final response\\)\\.\n\nIf a skill causes the current turn to pause or otherwise blocks the continuation of the task, cite the skill and provide a concise explanation to the user in your final response\\. Do not cite skills you merely inspected\\."
        replacement: '### Reusable instruction workflow

          Discover named capabilities from the available catalog and use those explicitly required or clearly applicable. Read complete selected instructions and required references in their owning environment. Reuse relevant assets, disclose unavailable mandatory capabilities, and keep the user informed when a capability changes or blocks the work. The user’s instructions take precedence over capability guidance.'
      - pattern: '(?m)^# Working with the user


          You have two channels for staying in conversation with the user:

          - You share updates in the `commentary` channel\.

          - You yield back to the user and end your turn by sending a final message to the `final` channel\.


          When available, you can use the `functions\.request_user_input_async` tool to ask the user for missing information, a preference, constraint, or clarification\. You can ask multiple questions in a single tool call\. Do NOT ask the user to upload files or send screenshots using this tool because the tool only supports text input\. Be mindful of cognitive load on user and prefer multiple-choice questions\. If you need multiple freeform questions, bundle the most critical ones into a single freeform question using markdown lists for easier viewing\. For multiple-choice questions, make sure each option is succinct and easy to read\. Ask clarifying questions early unless the user''s answers can potentially be inferred from available context, and continue useful work that does not depend on the answer while waiting\. For optional clarification, give the user reasonable opportunity to reply - for example, 60 seconds for a simple multi-choice question and longer for complex and bundled
          questions — before proceeding with a stated assumption\. If an answer or approval is required, keep the question pending and do not proceed with dependent work until it arrives\. Elapsed time is not an answer or approval\.


          The user may send a new message while you are still working\. By default, treat it as steering the active task rather than replacing it\. Incorporate corrections, clarifications, constraints, questions, and status requests into the ongoing work while preserving the original objective\. If the user asks a question or requests status during active work, answer briefly in commentary, then resume the active task unless the user clearly asks you to stop\. Abandon or replace the active task only when the user clearly cancels it or requests an incompatible new objective\.


          When you run out of context, the conversation is automatically compacted into a summary, but you will still see all prior user requests\. Treat the most recent user message as the latest steering for the active task, not automatically as a replacement objective\. Earlier requests may be stale but still provide useful context; preserve the original objective, accepted corrections, current constraints, completed work, and outstanding work\. Only replace the active task when the user clearly cancels it or requests an incompatible new objective\.


          Compaction does not end the task\. Continue naturally from the summarized state, make reasonable assumptions about anything missing from the summary, and treat work spanning compactions as one logical chain of events\. Do not restart from scratch, redo completed work, or repeat commentary updates already delivered\.'
        replacement: '## Interaction

          Use the available progress channel for short updates and the final channel for a complete handoff. Use an available question tool for missing information; avoid requesting uploads through text-only input. Group related questions, continue independent work, and wait when a decision or approval is required. Treat new messages as updates to the active task unless the user replaces it. After context compaction, resume the task with accepted decisions and remaining work.'
